name: Kalshi Earnings Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: kalshi-earnings-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and detect new markets
        run: |
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.request
          import urllib.parse
          import datetime
          import shutil

          BASE = "https://external-api.kalshi.com/trade-api/v2"
          PREFIX = "KXEARNINGSMENTION"
          ROOT = pathlib.Path("data")
          ROOT.mkdir(exist_ok=True)

          now = datetime.datetime.now(
              datetime.timezone.utc
          ).isoformat()

          def read(path, fallback=None):
              if path.exists():
                  return json.loads(path.read_text())
              return fallback

          def save(path, data):
              path.parent.mkdir(
                  parents=True, exist_ok=True
              )
              path.write_text(
                  json.dumps(data, indent=2) + "\n",
                  encoding="utf-8"
              )

          def api(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)

              for attempt in range(5):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "KalshiEarningsTracker/1.0",
                              "Accept": "application/json"
                          }
                      )
                      with urllib.request.urlopen(
                          req, timeout=45
                      ) as response:
                          return json.load(response)
                  except Exception as error:
                      if attempt == 4:
                          raise
                      print("Retrying:", error)
                      time.sleep(2 ** attempt)

          # Load the persistent discovery registry.
          discovery_path = ROOT / "discoveries.json"
          registry = read(discovery_path)

          if registry is None:
              # Initial baseline: existing collected markets
              # must not be treated as newly posted.
              previous = read(ROOT / "index.json", {})
              old_events = previous.get("events", [])
              seen_events = {
                  e["event_ticker"]: "baseline"
                  for e in old_events
              }
              seen_markets = {}

              for event in old_events:
                  file = pathlib.Path(event["file"])
                  content = read(file, {})
                  for market in content.get("markets", []):
                      seen_markets[market["ticker"]] = "baseline"

              registry = {
                  "initialized_at": now,
                  "seen_events": seen_events,
                  "seen_markets": seen_markets,
                  "new_events": [],
                  "new_markets": []
              }
              print(
                  "Baseline initialized:",
                  len(seen_events), "events;",
                  len(seen_markets), "markets"
              )

          # Discover all earnings-mention series.
          series_data = api(
              "/series", {"category": "Mentions"}
          )

          series = sorted({
              s["ticker"]
              for s in series_data.get("series", [])
              if s.get("ticker", "").startswith(PREFIX)
          })

          if not series:
              raise RuntimeError(
                  "No earnings series found"
              )

          markets_by_ticker = {}

          for series_ticker in series:
              cursor = ""
              while True:
                  params = {
                      "series_ticker": series_ticker,
                      "status": "open",
                      "limit": 1000
                  }
                  if cursor:
                      params["cursor"] = cursor

                  data = api("/markets", params)

                  for market in data.get("markets", []):
                      ticker = market.get("ticker", "")
                      if ticker.startswith(PREFIX):
                          markets_by_ticker[ticker] = market

                  cursor = data.get("cursor") or ""
                  if not cursor:
                      break

              time.sleep(0.12)

          if not markets_by_ticker:
              raise RuntimeError(
                  "No markets returned; old data preserved"
              )

          fields = [
              "ticker", "event_ticker", "title",
              "subtitle", "status",
              "yes_bid_dollars", "yes_ask_dollars",
              "no_bid_dollars", "no_ask_dollars",
              "yes_bid_size_fp", "yes_ask_size_fp",
              "last_price_dollars", "volume_fp",
              "close_time", "rules_primary"
          ]

          records = sorted(
              [
                  {k: m.get(k) for k in fields}
                  for m in markets_by_ticker.values()
              ],
              key=lambda m: m["ticker"]
          )

          grouped = {}
          for market in records:
              event = market.get("event_ticker")
              if event:
                  grouped.setdefault(
                      event, []
                  ).append(market)

          # Detect newly seen earnings events.
          fresh_events = []
          for event, items in sorted(grouped.items()):
              if event not in registry["seen_events"]:
                  registry["seen_events"][event] = now
                  entry = {
                      "first_seen": now,
                      "event_ticker": event,
                      "company": items[0].get("title"),
                      "contract_count": len(items)
                  }
                  registry["new_events"].append(entry)
                  fresh_events.append(entry)

          # Detect newly seen contracts.
          fresh_markets = []
          for market in records:
              ticker = market["ticker"]
              if ticker not in registry["seen_markets"]:
                  registry["seen_markets"][ticker] = now
                  entry = {
                      "first_seen": now,
                      "ticker": ticker,
                      "event_ticker": market["event_ticker"],
                      "company": market["title"],
                      "yes_ask": market.get(
                          "yes_ask_dollars"
                      )
                  }
                  registry["new_markets"].append(entry)
                  fresh_markets.append(entry)

          save(discovery_path, registry)

          # Short report for the latest refresh.
          save(ROOT / "new_since_last_refresh.json", {
              "updated": now,
              "new_event_count": len(fresh_events),
              "new_market_count": len(fresh_markets),
              "new_events": fresh_events,
              "new_markets": fresh_markets
          })

          # Preserve the full current dataset.
          save(ROOT / "latest.json", {
              "updated": now,
              "series_count": len(series),
              "market_count": len(records),
              "markets": records
          })

          # Refresh individual event files.
          events_dir = ROOT / "events"
          if events_dir.exists():
              shutil.rmtree(events_dir)
          events_dir.mkdir(parents=True)

          index = []

          for event, items in sorted(grouped.items()):
              file = "data/events/" + event + ".json"
              save(pathlib.Path(file), {
                  "event_ticker": event,
                  "company": items[0].get("title"),
                  "market_count": len(items),
                  "markets": items
              })
              index.append({
                  "event_ticker": event,
                  "company": items[0].get("title"),
                  "market_count": len(items),
                  "file": file
              })

          save(ROOT / "index.json", {
              "updated": now,
              "series_count": len(series),
              "event_count": len(index),
              "market_count": len(records),
              "events": index
          })

          print("Series:", len(series))
          print("Events:", len(index))
          print("Markets:", len(records))
          print("NEW EVENTS:", len(fresh_events))
          print("NEW CONTRACTS:", len(fresh_markets))
          print("Discovery registry saved")
          PY

      - name: Save results to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Refresh Kalshi earnings tracker"
            git push
          else
            echo "No changes to commit"
          fi
