name: Kalshi Earnings Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: kalshi-earnings-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect earnings mention markets
        run: |
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.request
          import urllib.parse
          import datetime
          import shutil

          BASE = "https://external-api.kalshi.com/trade-api/v2"
          PREFIX = "KXEARNINGSMENTION"

          def api(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)

              for attempt in range(5):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "KalshiEarningsTracker/1.0",
                              "Accept": "application/json"
                          }
                      )
                      with urllib.request.urlopen(
                          request, timeout=45
                      ) as response:
                          return json.load(response)
                  except Exception as error:
                      if attempt == 4:
                          raise
                      print("Retrying:", error)
                      time.sleep(2 ** attempt)

          def save(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(data, indent=2) + "\n",
                  encoding="utf-8"
              )

          series_data = api(
              "/series", {"category": "Mentions"}
          )

          series = sorted({
              s["ticker"]
              for s in series_data.get("series", [])
              if s.get("ticker", "").startswith(PREFIX)
          })

          print("Earnings series found:", len(series))

          if not series:
              raise RuntimeError("No earnings series found")

          markets_by_ticker = {}

          for series_ticker in series:
              cursor = ""
              while True:
                  params = {
                      "series_ticker": series_ticker,
                      "status": "open",
                      "limit": 1000
                  }
                  if cursor:
                      params["cursor"] = cursor

                  data = api("/markets", params)

                  for market in data.get("markets", []):
                      ticker = market.get("ticker", "")
                      if ticker.startswith(PREFIX):
                          markets_by_ticker[ticker] = market

                  cursor = data.get("cursor") or ""
                  if not cursor:
                      break

              time.sleep(0.12)

          markets = list(markets_by_ticker.values())

          if not markets:
              raise RuntimeError(
                  "No markets returned; preserving old data"
              )

          fields = [
              "ticker",
              "event_ticker",
              "title",
              "subtitle",
              "status",
              "yes_bid_dollars",
              "yes_ask_dollars",
              "no_bid_dollars",
              "no_ask_dollars",
              "yes_bid_size_fp",
              "yes_ask_size_fp",
              "last_price_dollars",
              "volume_fp",
              "close_time",
              "rules_primary"
          ]

          records = sorted(
              [
                  {k: m.get(k) for k in fields}
                  for m in markets
              ],
              key=lambda m: m["ticker"]
          )

          now = datetime.datetime.now(
              datetime.timezone.utc
          ).isoformat()

          # Retain the complete dataset.
          save(pathlib.Path("data/latest.json"), {
              "updated": now,
              "series_count": len(series),
              "count": len(records),
              "markets": records
          })

          # Group markets by earnings event.
          grouped = {}

          for m in records:
              event = m.get("event_ticker")
              if event:
                  grouped.setdefault(event, []).append(m)

          events_dir = pathlib.Path("data/events")

          # Remove files for events no longer active.
          if events_dir.exists():
              shutil.rmtree(events_dir)

          events_dir.mkdir(parents=True)

          index = []

          for event, items in sorted(grouped.items()):
              # Individual event files are small enough
              # for ChatGPT to retrieve independently.
              save(events_dir / (event + ".json"), {
                  "event_ticker": event,
                  "company": items[0].get("title"),
                  "market_count": len(items),
                  "markets": items
              })

              index.append({
                  "event_ticker": event,
                  "company": items[0].get("title"),
                  "market_count": len(items),
                  "file": "data/events/" + event + ".json"
              })

          # Compact index for finding companies.
          save(pathlib.Path("data/index.json"), {
              "updated": now,
              "series_count": len(series),
              "event_count": len(index),
              "market_count": len(records),
              "events": index
          })

          print("Series:", len(series))
          print("Events:", len(index))
          print("Markets:", len(records))
          print("Saved full dataset and event files")
          PY

      - name: Save results to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Refresh Kalshi market data"
            git push
          else
            echo "No changes to commit"
          fi
