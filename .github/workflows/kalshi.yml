name: Kalshi Earnings Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get Kalshi markets
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          import datetime, pathlib, time

          base = "https://external-api.kalshi.com/trade-api/v2/markets"
          markets = []
          cursor = ""

          while True:
              params = {
                  "series_ticker": "KXEARNINGSMENTIONSTZ",
                  "status": "open",
                  "limit": 1000
              }
              if cursor:
                  params["cursor"] = cursor
              url = base + "?" + urllib.parse.urlencode(params)
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(
                          url, headers={"User-Agent": "kalshi-earnings-tracker/1.0"}
                      )
                      with urllib.request.urlopen(req, timeout=40) as r:
                          data = json.load(r)
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)

              markets.extend(data.get("markets", []))
              cursor = data.get("cursor")
              if not cursor:
                  break

          if not markets:
              raise RuntimeError("No markets returned")

          fields = [
              "ticker", "event_ticker", "title", "status",
              "yes_bid_dollars", "yes_ask_dollars",
              "no_bid_dollars", "no_ask_dollars",
              "yes_bid_size_fp", "yes_ask_size_fp",
              "close_time", "rules_primary"
          ]
          output = {
              "updated": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "count": len(markets),
              "markets": [
                  {k: m.get(k) for k in fields}
                  for m in markets
              ]
          }

          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/latest.json").write_text(
              json.dumps(output, indent=2)
          )
          print("Collected", len(markets), "markets")
          PY

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Kalshi market snapshot"
            git push
          fi
